schema: spec-driven

context: |
  This repository is a public Claude Code plugin, eng-artifacts: a collection of skills for the
  optimized production of software engineering artifacts (WBS, UML, diagrams). CLAUDE.md is the authority for repository conventions.
  The repository is public: no artifact contains personal paths, client, company or person names,
  email addresses or private URLs. Examples use neutral placeholders.

  Two product guarantees bind every change:
  1. Visual coherence. All artifact types take their look from one shared visual language: a single
     style source of semantic tokens. The same role looks the same in every artifact type.
  2. Themable UI with a light/dark switch. A theme is a set of token values. Every theme defines a
     light and a dark mode. Every artifact renders correctly in both, and an interactive artifact
     lets the viewer switch.
  The checkable form of both guarantees is .claude/skills/visual-contract/SKILL.md (invariants VC-1
  to VC-6). A change that would break an invariant is not acceptable as proposed.
  The visual design is decided: the role vocabulary (token names) and drawing rules are in
  .claude/skills/visual-contract/references/design.md, and the theme values live only in the
  plugin's shared/themes/ (default.css, alt.css). Artifact pages are the primary target medium. A change uses those token names and does not
  alter the design on its own.

  Spec coverage starts empty: a missing spec does not mean missing behavior. The first change to a
  capability uses ADDED requirements.

rules:
  proposal:
    - Name the artifact types and the parts of the shared visual language the change touches.
    - Include a "Visual contract" section that says, per invariant VC-1 to VC-6, how the change keeps it or why the change does not affect it.
    - A change that makes a design decision (new component, rejected alternative, trade-off) includes design.md.
    - A change needs a performance evaluation only when it adds a new artifact skill, when it is a major refactoring of an existing one, or when the person asks for one; the proposal of a change to an existing artifact skill says whether it is a major refactoring. Any other change to an existing skill has no Effectiveness section, no testbed task and no evaluation task, and keeps the skill's last adopted evaluation.
    - A change that needs an evaluation includes an "Effectiveness" section (see .claude/skills/skill-eval/SKILL.md) that states the testbed cases (easy, medium, complex), the targets (the defaults of 20% fewer tokens and 20% less time, or stricter ones, never looser), the model and effort, and says the user records adopt, rework or reject on the final evaluation.
    - A change that adds a new artifact skill includes an "Exploration" section, written from the exploration that precedes it (Phase 0b of the orchestrator); it states the issue, the chosen run among the three runs of the one complex prompt (or that none fits), the person's hints, the features kept, how each feature maps to a role of the visual contract's vocabulary (reused or missing, a missing role being for the person to decide), and what is deliberately left out. A sketch run's own colors, fonts and sizes never carry into the proposal. A change to an existing artifact skill has no exploration.
  specs:
    - Capability paths are kebab-case.
    - A requirement about appearance names a semantic token role, never a literal color, font or size.
    - A capability that renders an artifact has at least one scenario for coherence with another artifact type and one for rendering in light and dark under a non-default theme.
  design:
    - List every token role the change adds or changes, and the artifact types that consume it.
    - A change that needs an evaluation lists, for each testbed case, its prompt in outline and its mechanical graders (deliverable exists, expected names present, the skill was used), and no model-judged grader.
  tasks:
    - Tick each checkbox as soon as its task is done.
    - A change that needs an evaluation has a task to write the testbed and run it once before the skill exists, to record the baseline and check that every case is fair.
    - The testbed task of a new artifact skill starts from the exploration's complex prompt (see "Seeding the testbed from the exploration" in .claude/skills/skill-eval/SKILL.md), so copy it as the complex case, write the easy and medium cases from the brief by reducing it to a subset of its features, revise all three with the person's hints, add the mechanical graders, then run the baseline. The sketches never count as the baseline.
    - A change that adds or changes a skill's SKILL.md (plugin or harness skill, never a generated openspec-* skill) has a skill review task (Phase 3a of the orchestrator): a review with skill-creator focused on how the skill describes its context management, applied directly to its SKILL.md and references, with no tests and no evals. It comes after the visual-reviewer task, or after the build when nothing is visual, and before the evaluation task when there is one.
    - End with a task for the visual-reviewer pass, then the skill review task, then, for a change that needs an evaluation, a task to evaluate the final skill with evals/run.sh and record the user's decision (adopt, rework or reject) in evals/<skill>/RESULTS.md, then the documentation step (a task to write skills/<skill>/README.md with its `summary:` front block and the performance markers, run `python3 evals/kpi.py doc` after the adopt, and check that bash tests/run-structural-tests.sh passes), then a task to archive the change as the last commit before merge. For a change that needs an evaluation, archive only after an adopt is recorded on an evaluation of the final version and the skill's README and the root README skills table show it.
