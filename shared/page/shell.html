<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style id="theme">
{{THEME_CSS}}
</style>
<style id="page">
{{PAGE_CSS}}
</style>
<script id="core">
{{CORE_JS}}
</script>
<script id="chrome">
{{CHROME_JS}}
</script>
</head>
<body data-type="{{TYPE}}">
<header class="page-head">
  <div class="page-titles">
    <h1 class="page-title">{{TITLE}}</h1>
{{DESCRIPTION}}
    <p class="page-meta" id="page-meta" hidden></p>
  </div>
  <div class="page-controls">
    <div class="zoom" role="group" aria-label="Zoom">
      <button type="button" id="zoom-out" aria-label="Zoom out" title="Zoom out">&minus;</button>
      <span class="zoom-level" id="zoom-level" aria-live="polite">100%</span>
      <button type="button" id="zoom-in" aria-label="Zoom in" title="Zoom in">+</button>
      <button type="button" id="zoom-fit" title="Fit the drawing to the width of its frame">Fit</button>
      <button type="button" id="zoom-actual" title="Actual size">1:1</button>
    </div>
    <label class="mode-toggle" title="Switch between light and dark mode">
      <input type="checkbox" id="mode-toggle" role="switch">
      <span class="mode-track"><span class="mode-thumb"></span></span>
      <span class="mode-label">Dark mode</span>
    </label>
  </div>
</header>
<main class="page">
  <div id="notices"></div>
  <div id="errors" role="alert"></div>
  <div class="frame" id="frame"><div id="drawing"></div></div>
  <p class="hint" id="hint" hidden>Point at a node, a connector or a row of the table to highlight what it connects; on a touch screen, tap it.</p>
  <div class="below" id="below" hidden>
    <section class="card" id="legend-card" aria-labelledby="legend-title" hidden>
      <h2 class="card-title" id="legend-title">Legend</h2>
      <div id="legend"></div>
    </section>
    <section class="card" id="details-card" aria-labelledby="details-title" hidden>
      <h2 class="card-title" id="details-title">Details</h2>
      <div class="card-scroll" id="details"></div>
    </section>
  </div>
</main>
{{EXTERNAL_SCRIPTS}}
<script id="renderer">
{{TYPE_JS}}
</script>
<script type="application/json" id="model">{{MODEL_JSON}}</script>
<script>Artifact.boot();</script>
</body>
</html>
